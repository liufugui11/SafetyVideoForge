version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/outputs:/app/outputs
      - ./configs:/app/configs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    restart: unless-stopped

  # 可选：Redis用于状态缓存
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
